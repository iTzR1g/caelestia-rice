# kitty theme — Arch blue (#1793d1) on Catppuccin Mocha
# base: #131317, accent: #1793d1

foreground #cdd6f4
background #131317
background_opacity 0.87
selection_background #45475a
selection_foreground #cdd6f4
url_color #1793d1
cursor #f5e0dc
cursor_text_color #131317

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2 #a6e3a1
color10 #a6e3a1

# yellow
color3 #f9e2af
color11 #f9e2af

# blue (Arch blue)
color4 #1793d1
color12 #1793d1

# purple/mauve
color5 #cba6f7
color13 #cba6f7

# cyan
color6 #94e2d5
color14 #94e2d5

# white
color7 #bac2de
color15 #bac2de

# Tab bar
tab_bar_style powerline
tab_bar_edge top
tab_bar_margin_width 0
tab_bar_margin_height 2
tab_separator " "
active_tab_foreground #131317
active_tab_background #1793d1
active_tab_font_style bold-italic
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244
inactive_tab_font_style italic

# Font
font_family      JetBrainsMono Nerd Font
bold_font         JetBrainsMono Nerd Font Bold
italic_font       JetBrainsMono Nerd Font Italic
bold_italic_font  JetBrainsMono Nerd Font Bold Italic
font_size 12.0

# Layout
hide_window_decoration no
confirm_os_window_close 0
bell_on_tab yes
visual_bell_duration 0.5

# Scrollback
scrollback_lines 10000
scrollback_pager_history_size 10
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# Mouse
mouse_hide_wait 2.0
url_excluded_characters ":/?=&"
url_style straight

# Performance
