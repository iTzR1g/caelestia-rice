# Starship config — Arch blue (#1793d1) on Catppuccin Mocha

add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"

format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$cmd_duration\
$character"""

right_format = """\
$custom\
$memory_usage\
$time"""

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic #1793d1)"
error_symbol = "[○](italic purple)"
vimcmd_symbol = "[■](italic dimmed green)"

[username]
style_user = "#1793d1 bold italic"
style_root = "purple bold italic"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "[$hostname](bold #1793d1)"
disabled = false

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "□ "
use_os_path_sep = true
style = "italic #1793d1"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = "bold #1793d1"
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold #1793d1)'

[git_branch]
format = " [$branch]($style)"
symbol = "[△](bold italic #1793d1)"
style = "italic #1793d1"
truncation_symbol = "⋯"
truncation_length = 11
ignore_branches = ["main", "master"]
only_attached = true

[git_status]
style = "bold italic #1793d1"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic bright-magenta)"
ahead = "[▴│[${count}](bold white)│](italic green)"
behind = "[▿│[${count}](bold white)│](italic red)"
diverged = "[◇ ▴┤[${ahead_count}](regular white)│▿┤[${behind_count}](regular white)│](italic bright-magenta)"
untracked = "[◌◦](italic bright-yellow)"
stashed = "[◃◈](italic white)"
modified = "[●◦](italic yellow)"
staged = "[▪┤[$count](bold white)│](italic bright-cyan)"
renamed = "[◎◦](italic bright-blue)"
deleted = "[✕](italic red)"

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
disabled = false

[cmd_duration]
min_time = 0
format = "[◄ $duration ](italic white)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}]($style)"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
style = "italic dimmed white"
